<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledger</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161d;
    --line: #1e252e;
    --line-soft: #171d25;
    --text: #c9d1d9;
    --dim: #7d8590;
    --faint: #484f58;
    --working: #3fb950;
    --awaiting: #d29922;
    --error: #f85149;
    --unowned: #58a6ff;
    --started: #bc8cff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; }
  body { font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--unowned); }

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .mark { font: 600 15px/1 var(--mono); letter-spacing: .02em; }
  .mark span { color: var(--faint); font-weight: 400; margin-left: 8px; }
  .counts { display: flex; gap: 14px; font: 12px var(--mono); color: var(--dim); }
  .counts b { color: var(--text); font-weight: 500; }
  .spacer { flex: 1; }
  #q {
    width: 230px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 5px; padding: 6px 9px; font: 12px var(--mono);
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: 1px solid #2f81f7; outline-offset: -1px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--working); }
  .live-dot.stale { background: var(--faint); }
  .stamp { font: 11px var(--mono); color: var(--faint); }

  nav {
    display: flex; gap: 2px; padding: 10px 24px 0; border-bottom: 1px solid var(--line);
  }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); font: 12px var(--sans); padding: 7px 11px 9px; cursor: pointer;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
  nav .n { color: var(--faint); margin-left: 5px; font: 11px var(--mono); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    text-align: left; font: 500 10px var(--sans); letter-spacing: .07em;
    text-transform: uppercase; color: var(--faint); padding: 9px 12px 7px;
    border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0;
  }
  thead th:first-child { padding-left: 24px; }
  tbody tr.row { cursor: pointer; height: 40px; }
  tbody tr.row:hover td { background: #121821; }
  tbody tr.row.sel td { background: #161d27; }
  tbody tr.row.sel td:first-child { box-shadow: inset 2px 0 0 #2f81f7; }
  td { padding: 0 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr.row { scroll-margin-top: 98px; }
  td:first-child { padding-left: 24px; }
  .c-state { width: 152px; }
  .c-proj { width: 150px; }
  .c-target { width: 180px; }
  .c-age { width: 104px; text-align: right; }


  .state { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .state svg { width: 14px; height: 14px; flex: none; }
  .state .label { font: 11.5px var(--mono); letter-spacing: -0.01em; }
  .s-working .label, .s-quiet-working .label { color: var(--working); }
  .s-awaiting .label, .s-quiet-awaiting .label, .s-queued .label { color: var(--awaiting); }
  .s-error .label { color: var(--error); }
  .s-idle .label { color: var(--dim); }
  .s-ended .label { color: var(--faint); }
  .s-started .label { color: var(--started); }
  .s-recent-unowned .label { color: var(--unowned); }

  .intent { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.row:not(.sel):not(:hover) .intent { color: #a9b2bd; }
  .proj, .target, .age { font: 12px var(--mono); }
  .proj { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target.off { color: var(--faint); }
  .target .pin { color: var(--faint); }
  .age { color: var(--faint); }
  .flip { color: var(--faint); display: inline-block; width: 14px; margin-left: 8px; transition: transform .12s; }
  tr.row.open .flip { transform: rotate(90deg); }

  tr.detail td { background: var(--panel); border-bottom: 1px solid var(--line); }
  .detail-in {
    display: grid; grid-template-columns: 84px 1fr; gap: 5px 14px;
    padding: 12px 4px 16px 16px; font: 12px/1.5 var(--mono); max-width: 1100px;
  }
  .detail-in dt { color: var(--faint); }
  .detail-in dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
  .detail-in .warn { color: var(--awaiting); }
  .detail-in .muted { color: var(--dim); }
  .cmd { display: flex; align-items: center; gap: 10px; }
  .cmd code {
    background: #0a0e13; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 7px; color: #a5d6ff;
  }
  .cmd button {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: 11px var(--sans); border-radius: 4px; padding: 3px 8px; cursor: pointer;
  }
  .cmd button:hover { color: var(--text); border-color: var(--faint); }

  .empty { padding: 56px 24px; color: var(--faint); font: 13px var(--mono); text-align: center; }
  footer {
    padding: 12px 24px 20px; color: var(--faint); font: 11px var(--mono);
    display: flex; gap: 18px; border-top: 1px solid var(--line-soft); margin-top: 8px;
  }
  kbd {
    border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
    font: 10px var(--mono); color: var(--dim);
  }
  @media (prefers-reduced-motion: no-preference) {
    .s-working svg, .s-quiet-working svg { animation: spin 2.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>
<header>
  <div class="mark">ledger<span>pi sessions</span></div>
  <div class="counts" id="counts"></div>
  <div class="spacer"></div>
  <input id="q" placeholder="filter intent, project, id" autocomplete="off" spellcheck="false">
  <div class="live-dot" id="dot"></div>
  <div class="stamp" id="stamp">–</div>
</header>

<nav id="tabs" role="tablist"></nav>

<main>
  <table>
    <colgroup>
      <col class="c-state"><col class="c-proj"><col><col class="c-target"><col class="c-age">
    </colgroup>
    <thead>
      <tr><th>state</th><th>project</th><th>intent</th><th>target</th><th style="text-align:right">last</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>nothing here</div>
</main>

<footer>
  <span><kbd>j</kbd><kbd>k</kbd> move</span>
  <span><kbd>enter</kbd> expand</span>
  <span><kbd>/</kbd> filter</span>
  <span><kbd>esc</kbd> clear</span>
  <span id="note"></span>
</footer>

<script>
const ICON = {
  working: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="9 6" stroke-linecap="round"/></svg>`,
  "quiet-working": `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#2b6e39" stroke-width="1.6" stroke-dasharray="9 6" stroke-linecap="round"/></svg>`,
  awaiting: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#d29922" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="#d29922"/></svg>`,
  "quiet-awaiting": `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#8a6417" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="#8a6417"/></svg>`,
  queued: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#d29922" stroke-width="1.6" stroke-dasharray="2 3"/></svg>`,
  error: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#f85149" stroke-width="1.6"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="#f85149" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  idle: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="#484f58"/></svg>`,
  ended: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="#3a4149" stroke-width="1.4" stroke-dasharray="3 3"/></svg>`,
  started: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="#bc8cff" stroke-width="1.4" stroke-dasharray="1 3.2" stroke-linecap="round"/></svg>`,
  "recent-unowned": `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`,
  unknown: `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="#484f58" stroke-width="1.4"/></svg>`,
};

// pi-subagents writes one transcript per run under sessions/<parent>/<uuid>/run-N/.
// Those are runs, not sessions a human resumes, so they get their own tab.
const isRun = r => r.kind === "subagent";
const TABS = [
  { id: "all", label: "all", test: r => !isRun(r) },
  { id: "live", label: "live", test: r => r.live && !isRun(r) },
  { id: "needs", label: "needs you", test: r => !isRun(r) && ["awaiting", "quiet-awaiting", "error"].includes(r.state) },
  { id: "ended", label: "ended", test: r => !r.live && !isRun(r) },
  { id: "runs", label: "runs", test: isRun },
];

let state = { sessions: [] };
let tab = "all";
let filter = "";
let selected = null;      // session id or "pid:<pid>"
let open = new Set();
const hash = new URLSearchParams(location.hash.slice(1));
const linked = hash.get("s");
if (["all", "live", "needs", "ended", "runs"].includes(hash.get("t"))) tab = hash.get("t");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function age(s) {
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}

function key(r) { return r.id || "pid:" + r.pid; }

function rows() {
  const t = TABS.find(t => t.id === tab).test;
  const f = filter.trim().toLowerCase();
  return state.sessions
    .filter(t)
    .filter(r => !f || (r.intent + " " + r.project + " " + r.id + " " + r.tmux).toLowerCase().includes(f));
}

function drawTabs() {
  const all = state.sessions;
  $("#tabs").innerHTML = TABS.map(t => {
    const n = all.filter(t.test).length;
    return `<button role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}">${t.label}<span class="n">${n}</span></button>`;
  }).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
}

function drawCounts() {
  const s = state.sessions.filter(r => !isRun(r));
  const live = s.filter(r => r.live).length;
  const wait = s.filter(r => ["awaiting", "quiet-awaiting", "error"].includes(r.state)).length;
  const end = s.filter(r => !r.live).length;
  $("#counts").innerHTML =
    `<span><b>${live}</b> live</span><span><b>${wait}</b> waiting</span><span><b>${end}</b> ended</span>` +
    (state.inferred_bindings ? `<span title="owner inferred from creation time or compaction, not from a registry"><b>${state.inferred_bindings}</b> inferred</span>` : "") +
    (state.unbound_processes ? `<span title="live pi process with no transcript yet (launched, never prompted)"><b>${state.unbound_processes}</b> unbound</span>` : "");
  $("#stamp").textContent = new Date(state.generated_epoch * 1000).toLocaleTimeString();
  $("#note").textContent = state.pi_processes + " pi procs · " + state.tmux_sessions + " tmux sessions · " + state.sessions.length + " indexed";
}

function detail(r) {
  const bits = [];
  const add = (k, v, cls = "") => bits.push(`<dt>${k}</dt><dd class="${cls}">${v}</dd>`);
  add("session", r.id ? `<span>${esc(r.id)}</span>` : `<span class="muted">no transcript</span>`);
  add("cwd", esc(r.home_rel));
  if (r.tmux !== "-") add("tmux", `${esc(r.tmux)}${r.pane_size ? " · " + esc(r.pane_size) : ""}`
    + `${r.pane_cmd ? " · " + esc(r.pane_cmd) : ""}`);
  if (r.live) add("owner", `pid ${esc(r.pid)} · binding ${esc(r.binding)}` +
    (["exact", "launched"].includes(r.binding) ? ""
      : r.binding === "created-after" || r.binding === "succession"
        ? ` <span class="muted">(inferred)</span>` : ` <span class="warn">(a guess)</span>`));
  add("activity", `${esc(r.last_activity)} · started ${esc(r.started)}`);
  add("store", `${esc(r.store)} · ${Math.round((r.size || 0) / 1024)} KiB` + (r.copies > 1 ? ` · ${r.copies} copies` : ""));
  if (r.path) add("file", `<span class="muted">${esc(r.path)}</span>`);
  if (r.restore) add("restore", `<span class="cmd"><code>${esc(r.restore)}</code><button data-copy="${esc(r.restore)}">copy</button></span>`);
  add("pinned", r.pinned ? "yes" : `<span class="muted">no</span>`);
  return `<dt></dt><dd><div class="detail-in">${bits.join("")}</div></dd>`;
}

function draw() {
  const list = rows();
  const body = $("#rows");
  body.innerHTML = list.map((r, i) => {
    const k = key(r);
    const sel = k === selected ? " sel" : "";
    const isOpen = open.has(k) ? " open" : "";
    const tgt = r.tmux !== "-" ? r.tmux : (r.tmux_session || "—");
    const off = r.tmux === "-" ? " off" : "";
    const intent = (r.intent || "").replace(/\s+/g, " ");
    return `<tr class="row${sel}${isOpen}" data-k="${esc(k)}" data-i="${i}" tabindex="-1">
        <td><div class="state s-${esc(r.state)}">${ICON[r.state] || ICON.unknown}<span class="label">${esc(r.state)}</span></div></td>
        <td class="proj">${esc(r.project)}</td>
        <td class="intent" title="${esc(intent)}">${esc(intent)}</td>
        <td class="target${off}">${esc(tgt)}</td>
        <td class="age">${age(r.idle_s)}<span class="flip">›</span></td>
      </tr>` + (isOpen ? `<tr class="detail"><td></td><td colspan="4">${detail(r)}</td></tr>` : "");
  }).join("");
  $("#empty").hidden = list.length > 0;
  body.querySelectorAll("tr.row").forEach(tr => {
    tr.onclick = () => { selected = tr.dataset.k; toggle(tr.dataset.k); };
  });
  body.querySelectorAll("[data-copy]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    navigator.clipboard?.writeText(b.dataset.copy);
    b.textContent = "copied";
    setTimeout(() => b.textContent = "copy", 1200);
  });
  if (selected && pendingScroll) {
    pendingScroll = false;
    const cur = body.querySelector(`tr.row[data-k="${CSS.escape(selected)}"]`);
    cur?.scrollIntoView({ block: "nearest" });
  }
}

function toggle(k) {
  if (open.has(k)) open.delete(k); else open.add(k);
  draw();
}

let pendingScroll = false;

function move(d) {
  const list = rows();
  if (!list.length) return;
  let i = list.findIndex(r => key(r) === selected);
  i = i < 0 ? 0 : Math.min(list.length - 1, Math.max(0, i + d));
  selected = key(list[i]);
  pendingScroll = true;
  draw();
}

document.addEventListener("keydown", e => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape") { $("#q").blur(); if (filter) { filter = ""; $("#q").value = ""; draw(); } return; }
  if (typing) return;
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  if ((e.key === "Enter" || e.key === " ") && selected) { e.preventDefault(); toggle(selected); }
});

$("#q").addEventListener("input", e => { filter = e.target.value; draw(); });

async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    state = await res.json();
    if (linked && !selected) {
      const hit = state.sessions.find(r => (r.id && r.id.startsWith(linked)) || key(r) === linked);
      if (hit) { selected = key(hit); open.add(key(hit)); }
    }
    $("#dot").classList.remove("stale");
  } catch {
    $("#dot").classList.add("stale");
  }
  drawTabs(); drawCounts(); draw();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
